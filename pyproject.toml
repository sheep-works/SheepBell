[project]
name = "sheepbell"
version = "1.0.0"
description = "Automated video clipping and transcription tool for game LQA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
    "silero-vad>=5.1.0",
    "faster-whisper>=1.0.0",
    "imageio-ffmpeg>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lqa_clipper"]
